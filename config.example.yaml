# نمونه‌ی تنظیمات پایپ‌لاین خوراک محتوایی.
# کپی کنید به config.yaml و مقادیر را پر کنید:
#     cp content_pipeline/config.example.yaml config.yaml
#
# هیچ کلید API لازم نیست — هزینه‌ی این ابزار صفر است.

database:
  path: content_pipeline/data/runs.db

# ---------------------------------------------------------------------------
# موضوع هدف (Topic-Agnostic — معمولاً فقط همین بخش را عوض می‌کنید)
# ---------------------------------------------------------------------------
run:
  # ساده‌ترین راه: از تب «شروع» پنل نوع محصول را تیک بزنید. این کلید همان است.
  # مقادیر آماده: جزوه، رمان، کتاب، کتاب درسی، کتاب دانشگاهی، کتاب دانش‌آموزی
  # (هر نام دیگری هم بدهید، به‌عنوان دسته‌ی سفارشی پذیرفته می‌شود)
  categories: []

  # اگر categories خالی باشد، این دو استفاده می‌شوند:
  target_topic: "جزوه"
  # ۵ تا ۱۰ نمونه‌عنوان دستی؛ بردار مرجع از همین‌ها ساخته می‌شود.
  topic_examples:
    - "جزوه ریاضی عمومی ۱"
    - "جزوه فیزیک پیش‌دانشگاهی"
    - "جزوه خانواده پیام نور"
    - "جزوه شیمی آلی دانشگاهی"
    - "جزوه آمار و احتمال مهندسی"
  # آستانه‌ی تشخیص موضوعی خودکار کالیبره می‌شود: فاصله‌ی نمونه‌های خودِ دسته تا
  # چند عنوان عمداً بی‌ربط اندازه گرفته و مرز وسطشان گذاشته می‌شود. عدد ثابت با
  # انکودرهای مختلف معنای یکسانی ندارد (انکودر جایگزین به عنوان مرتبط ۰.۵
  # می‌دهد و e5 به عنوان بی‌ربط ۰.۷).
  auto_threshold: true
  # فقط وقتی auto_threshold: false باشد اثر دارند:
  relevance_threshold: 0.65   # >= این مقدار → مرتبط
  review_threshold: 0.50      # بین این دو → شیت C (بازبینی دستی)

# ---------------------------------------------------------------------------
# سایت‌های رقیب
# ---------------------------------------------------------------------------
# از تب «شروع» پنل می‌توانید تا ۳۰۰ لینک را یکجا بچسبانید؛ آن‌ها به همان اجرا
# می‌چسبند و این فایل دست‌نخورده می‌ماند. کلید زیر حالت پیش‌فرض است.
#
# ساده‌ترین حالت، فقط آدرس:
#
# sites:
#   - https://example1.ir
#   - https://example2.ir
#
# یا با تنظیمات دقیق‌تر برای هر سایت (توصیه‌شده — جلوی کراول صفحات بلاگ را می‌گیرد):
sites:
  - url: https://example1.ir
    product_url_include: ["/product/", "/p/"]
    product_url_exclude: ["/tag/", "/category/", "\\?"]
    site_name: "فروشگاه نمونه"   # برای حذف نام سایت از <title>
    title_selector: null          # null یعنی h1 → og:title → title
  - url: https://example2.ir
    product_url_include: ["/downloads/"]
    js: true                      # این سایت با Playwright گرفته شود
    seed_urls:
      - https://example2.ir/downloads/

crawl:
  max_depth: 3
  max_pages: 500
  delay_seconds: 1.0            # حداکثر ۱ درخواست در ثانیه به هر دامنه
  timeout: 20
  user_agent: "ContentFeedBot/1.0 (+https://example.com/bot)"
  respect_robots: true
  playwright_fallback: true

# ---------------------------------------------------------------------------
# فاز ۰ — نرمال‌سازی فارسی
# ---------------------------------------------------------------------------
normalizer:
  digit_target: fa              # fa یا en — فقط یکی، ولی ثابت
  use_core_stopwords: true      # دانلود، خرید، رایگان، pdf، فایل، کامل، جدید، نسخه، اورجینال
  use_extra_stopwords: true
  custom_stopwords: []          # کلمات ایستای خاص حوزه‌ی خودتان
  strip_years: true             # حذف ۱۴۰۳، ۱۴۰۴، 2024، ...
  zwnj: strip                   # strip | space | keep
  extra_names: []               # نام‌های خاصی که در گازتیر نیستند

# ---------------------------------------------------------------------------
# فاز ۲ — Entity Resolution
# ---------------------------------------------------------------------------
resolve:
  similarity_threshold: 0.80    # زیر این مقدار اصلاً بررسی نمی‌شود
  blocking_top_tokens: 3        # تعداد نادرترین کلمات به‌عنوان کلید بلاک

  # نردبان آستانه بر اساس شواهد هویتی — هرچه نشانه‌ی کمتری از نویسنده داشته
  # باشیم، سخت‌گیری روی شباهت عنوان بیشتر می‌شود:
  #
  #   نویسنده‌ی هر دو طرف یکی است  → strong_match_threshold
  #   فقط یک طرف نویسنده دارد      → strong_match_threshold + یکتا بودن نویسنده
  #   هیچ‌کدام نویسنده ندارند       → no_entity_threshold
  #
  # ۰.۸۸ از اندازه‌گیری روی نمونه‌های واقعی آمده: دو رمان متفاوت از یک نویسنده
  # («شب سرد الناز» / «شب بخیر الناز») تا ۰.۸۶ شباهت می‌روند.
  strong_match_threshold: 0.88
  no_entity_threshold: 0.95

# ---------------------------------------------------------------------------
# فاز ۳ — گوگل ساجست (endpoint غیررسمی — این مقادیر را سبک نگیرید)
# ---------------------------------------------------------------------------
suggest:
  hl: fa
  gl: ir
  delay_min: 2                  # تأخیر تصادفی بین درخواست‌ها (ثانیه)
  delay_max: 4
  max_per_session: 300          # سقف کوئری در هر نشست

  # کوئری از عنوان محصول ساخته می‌شود، نه خودِ عنوان: کلمات فروشگاهی (دانلود،
  # pdf، نسخه کامل و اصلی) حذف و طول محدود می‌شود. عنوان خام فروشگاهی چیزی
  # نیست که کسی سرچ کند و گوگل برایش پیشنهادی ندارد.
  max_query_words: 8

  # یک عنوان با شکل کامل ممکن است هیچ پیشنهادی نداشته باشد ولی با دو کلمه
  # کمتر یا با پیشوند «دانلود» داشته باشد. این تعداد شکل مختلف امتحان می‌شود
  # (هر کدام یک کوئری) و به‌محض رسیدن به enough_keywords متوقف می‌شویم.
  max_variants_per_product: 4
  enough_keywords: 8
  query_prefixes: ["دانلود", "پی دی اف"]

  # گوگل کنار پیشنهادهای مرتبط، شبیه‌های بی‌ربط هم می‌دهد («رمان غرور و تعصب»
  # برای «رمان ارباب تعصبی»). پیشنهادی نگه داشته می‌شود که این نسبت از کلمات
  # عبارت جستجو در آن آمده باشد. ۱.۰ یعنی همه‌ی کلمات.
  min_keyword_coverage: 1.0

  # سه *خطای* پشت‌سرهم (HTTP غیر ۲۰۰ یا پاسخ غیرقابل‌پارس) → توقف. این نشانه‌ی
  # بلاک شدن است.
  max_consecutive_failures: 3
  # پاسخ ۲۰۰ با فهرست خالی خطا نیست؛ یعنی آن عبارت ساجست ندارد. فقط این تعداد
  # خالیِ پشت‌سرهم متوقف می‌کند:
  max_consecutive_empty: 40
  timeout: 15
  cache_ttl_days: 30            # نتایج تا این مدت از کش خوانده می‌شوند

# ---------------------------------------------------------------------------
# خروجی
# ---------------------------------------------------------------------------
output:
  # کدام شیت‌ها ساخته شوند — از تب «شروع» پنل هم قابل تغییر است:
  #   ready   → فقط محصولاتی که ساجست دارند
  #   archive → فقط محصولاتی که ساجست ندارند
  #   all     → همه با هم، با ستون «ساجست: دارد/ندارد»
  #   review  → مواردی که ابزار مطمئن نبوده
  sheets: [ready, archive, all, review]

  # هر کلمه‌ی ساجست در ستون خودش (suggest_1، suggest_2، ...) کنار ستون یکجا.
  # صفر یعنی فقط ستون یکجا.
  keyword_columns: 10

  xlsx_path: "content_pipeline/data/output-{run_id}.xlsx"
  sheet_id: ""                  # شناسه‌ی گوگل‌شیت (خالی = فقط فایل محلی)
  service_account_json: ""      # مسیر فایل service account
  tabs:
    ready: "آماده تولید محتوا"
    archive: "آرشیو آینده"
    all: "همه محصولات"
    review: "نیاز به بازبینی دستی"

# ---------------------------------------------------------------------------
# فاز ۵ — تکمیل گوگل‌شیت محصولات
# ---------------------------------------------------------------------------
# این فاز ستون‌های شیتی را پر می‌کند که بعداً به اسکریپت درج محصول می‌دهید:
# کلمه‌ی کلیدی، نویسنده، خلاصه، دسته، تگ، ملیت، فرمت، مترجم، تعداد صفحات و تصویر.
# ستون‌های «وضعیت» و «شناسه محصول» عمداً دست‌نخورده می‌مانند.
#
# همه‌ی این کلیدها از تبِ «تکمیل دیتیل» پنل هم قابل تنظیم‌اند و آنجا اولویت دارند.
details:
  # --- اتصال ---------------------------------------------------------------
  sheet_id: ""                  # شناسه‌ی گوگل‌شیت محصولات (وسط آدرس شیت)
  service_account_json: ""      # مسیر فایل json سرویس‌اکانت (شیت را با ایمیلش شیر کنید)
  tab: ""                       # نام تبِ محصولات؛ خالی = اولین تب
  lists_tab: "لیست‌ها"           # تبی که گزینه‌های کرکره‌ها در آن است
  report_tab: "گزارش تکمیل"      # تبی که گزارش هر ردیف در آن نوشته می‌شود ("" = ننویس)
  header_row: 1                 # سطری که عنوان ستون‌ها در آن است
  file: ""                      # به‌جای گوگل‌شیت: یک csv/xlsx محلی (بدون حساب گوگل)

  # نگاشت ستون‌ها. معمولاً لازم نیست: عنوان ستون‌های رایج (فارسی و انگلیسی)
  # خودکار شناخته می‌شوند. اگر عنوان ستون شما فرق دارد، اینجا نام یا حرف ستون
  # را بدهید:
  # columns:
  #   title: "عنوان محتوا"
  #   keyword: "B"
  columns: {}

  # ستون‌هایی که هرگز نوشته نمی‌شوند — این‌ها مالِ اسکریپت درج محصول‌اند
  never_write: [title, status, product_id]

  # --- قواعد نوشتن ---------------------------------------------------------
  overwrite: empty              # empty = فقط سلول خالی، always = بازنویسی
  retry_partial: false          # ردیف‌های «ناقص» در اجرای بعدی دوباره امتحان شوند؟
  limit: 0                      # سقف کل عنوان‌ها (۰ = همه)
  max_titles_per_session: 0     # سقف هر اجرا (۰ = بی‌سقف) — برای ۱۵ هزار عنوان مفید است
  max_pages_per_session: 0      # سقف صفحه‌ی دانلودی هر اجرا (۰ = بی‌سقف)
  batch_rows: 100               # هر چند ردیف یک‌بار در شیت نوشته شود
  batch_ranges: 400             # حداکثر محدوده در هر درخواست گوگل
  cache_ttl_days: 30            # استخراج هر صفحه تا این مدت از کش خوانده می‌شود
  multi_select_separator: "، "   # همان جداکننده‌ای که اسکریپت چندانتخابی شما می‌گذارد

  # --- پیدا کردن منابع -----------------------------------------------------
  max_sources_per_title: 5      # چند صفحه‌ی منبع برای هر عنوان کافی است
  min_title_similarity: 0.72    # کمتر از این شباهت یعنی «این صفحه محصول دیگری است»
  search:
    enabled: true               # اگر عنوان در دیتابیس منبع نداشت، در خود سایت‌ها بگرد
    url_template: "{base}/?s={query}"   # جستجوی وردپرس؛ برای سایت غیروردپرسی عوضش کنید
    max_results_per_site: 8

  # --- ستون‌ها -------------------------------------------------------------
  use_suggest_keyword: true     # اگر فاز ۳ اجرا شده، کلمه‌ی کلیدی از ساجست گرفته شود
  combine_author_scripts: true  # «ریتا کنت (Rina Kent)» برای رمان‌های ترجمه
  max_categories: 3
  max_tags: 5

  summary:
    min_chars: 200              # کمتر از این، در گزارش «خلاصه‌ی کوتاه» علامت می‌خورد
    max_chars: 1200
    max_sentences: 14

  pages:
    tolerance: 10               # اختلاف قابل‌قبول بین منابع (تبلیغات چند صفحه‌ای)
    min_agreement: 2            # چند منبع باید یک عدد بدهند تا مطمئن باشیم
    accept_single: true         # عدد تک‌منبعی نوشته شود ولی در گزارش علامت بخورد

  image:
    enabled: true
    min_side: 400               # کمتر از این پیکسل، کاور نیست
    square_tolerance: 0.04      # ۴٪ انحراف از مربع قابل قبول است
    max_downloads: 6            # حداکثر تصویری که برای اندازه‌گیری هدرش گرفته می‌شود
    require_square: true
    allow_unknown_size: false   # تصویری که اندازه‌اش تأیید نشد نوشته نشود
    reject_url_patterns: []     # کلمه‌های اضافه برای رد کردن (watermark، logo و ... پیش‌فرض‌اند)
    prefer_domains: []          # دامنه‌هایی که می‌دانید کاور تمیز دارند
    block_domains: []           # دامنه‌هایی که همیشه واترمارک می‌زنند

  labels:
    iranian: "ایرانی"
    foreign: "خارجی"
    pdf: "پی دی اف"
    audio: "صوتی"

  # گزینه‌های مجاز کرکره‌ها. اگر تبِ «لیست‌ها» در شیت پر باشد، همان اولویت دارد
  # و این‌ها فقط پشتیبان‌اند. مترادف‌ها برای تطبیق برچسب سایت‌های منبع‌اند.
  taxonomy: {}
  #   categories: ["رمان عاشقانه", "رمان اجتماعی", "رمان معمایی"]
  #   tags: ["رمان بدون سانسور", "رمان بزرگسال"]
  #   category_synonyms:
  #     رمان عاشقانه: ["عاشقانه", "romance"]
