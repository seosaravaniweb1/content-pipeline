# نمونه‌ی تنظیمات «تکمیل‌کننده‌ی گوگل‌شیت».
# کپی کنید به config.yaml و مقادیر را پر کنید:
#     cp sheet_filler/config.example.yaml config.yaml
#
# هیچ کلید API لازم نیست — هزینه‌ی این برنامه صفر است.
# تقریباً همه‌ی این کلیدها از پنل هم قابل تنظیم‌اند و آنجا اولویت دارند.

database:
  path: sheet_filler/data/filler.db

# ---------------------------------------------------------------------------
# شیت محصولات
# ---------------------------------------------------------------------------
sheet:
  sheet_id: ""                  # شناسه‌ی گوگل‌شیت (تکه‌ی وسط آدرس شیت)
  service_account_json: ""      # مسیر فایل json سرویس‌اکانت؛ شیت را با ایمیلش شیر کنید
  tab: ""                       # نام تبِ محصولات؛ خالی = اولین تب
  lists_tab: "لیست‌ها"           # تبی که گزینه‌های کرکره‌ها در آن است
  report_tab: "گزارش تکمیل"      # تبِ گزارش ("" = ننویس)
  header_row: 1                 # سطری که عنوان ستون‌ها در آن است
  file: ""                      # به‌جای گوگل‌شیت: یک csv/xlsx محلی (بدون حساب گوگل)

  # ستون‌ها از خودِ شیت خوانده می‌شوند. عنوان هر ستون هم برچسبی است که در
  # جدول مشخصاتِ منابع دنبالش می‌گردیم و هم نوع ستون را تعیین می‌کند:
  #   «تعداد ...» عدد | «کد ...» متن | «آیا/دارای ...» دارد/ندارد
  #   «خلاصه/توضیحات» متن چندمنبعی | «تصویر» کاور | ستونی که در تبِ لیست‌ها
  #   ستون هم‌نام دارد → کرکره‌ای
  title_column: ""              # خالی = ستون اول شیت
  sources_column: ""            # اگر ستونی دارید که آدرس صفحه‌ی منبع در آن است

  # فقط برای وقتی حدس خودکار کافی نیست. کلید = عنوان ستون در شیت شما:
  # columns:
  #   "زمان آزمون":
  #     kind: number            # number | text | person | summary | choice
  #                             # multi_choice | boolean | image | keyword | skip
  #     labels: ["مدت زمان آزمون", "زمان پاسخگویی"]
  #     max_value: 500
  #   "جزوه همراه":
  #     kind: boolean
  #     true_label: "دارد"
  #     false_label: "ندارد"
  #     true_hints: ["همراه با جزوه", "به همراه جزوه"]
  columns: {}

  # ستون‌هایی که هرگز نوشته نمی‌شوند (نام داخلی یا عنوان ستون خودتان)
  never_write: [title, status, product_id, وضعیت, شناسه محصول]

# ---------------------------------------------------------------------------
# سایت‌های منبع
# ---------------------------------------------------------------------------
# ساده‌ترین حالت، فقط آدرس:
#
# sites:
#   - https://shop1.ir
#   - https://shop2.ir
#
# یا با تنظیمات دقیق‌تر برای هر سایت:
sites: []
#   - url: https://shop1.ir
#     search_url: "{base}/?s={query}"      # قالب جستجو (پیش‌فرض وردپرس)
#     include: ["/product/"]               # فقط این آدرس‌ها صفحه‌ی محصول‌اند
#     exclude: ["/tag/"]
#     site_name: "فروشگاه یک"               # برای حذف نام سایت از <title>
#     js: false                            # true = با مرورگر گرفته شود

search:
  enabled: true                 # اگر آدرس منبع را نداریم، در سایت‌ها بگرد
  url_template: "{base}/?s={query}"
  max_results_per_site: 8

crawl:
  delay_seconds: 1.0            # حداکثر ۱ درخواست در ثانیه به هر دامنه
  timeout: 20
  user_agent: "SheetFillerBot/1.0 (+https://example.com/bot)"
  respect_robots: true
  playwright_fallback: true     # سایت‌های JS-heavy با مرورگر گرفته شوند

# ---------------------------------------------------------------------------
# قواعد پر کردن
# ---------------------------------------------------------------------------
fill:
  overwrite: empty              # empty = فقط سلول خالی، always = بازنویسی
  retry_partial: false          # ردیف‌های «ناقص» در اجرای بعدی دوباره امتحان شوند؟
  limit: 0                      # سقف کل عنوان‌ها (۰ = همه)
  max_titles_per_session: 0     # سقف هر اجرا — برای ۱۵ هزار عنوان مفید است
  max_pages_per_session: 0      # سقف صفحه‌ی دانلودی هر اجرا
  max_sources_per_title: 5      # چند صفحه‌ی منبع برای هر عنوان کافی است
  min_title_similarity: 0.72    # کمتر از این یعنی «این صفحه محصول دیگری است»
  batch_rows: 100               # هر چند ردیف یک‌بار در شیت نوشته شود
  cache_ttl_days: 30            # استخراج هر صفحه تا این مدت از کش خوانده می‌شود
  multi_select_separator: "، "   # همان جداکننده‌ی اسکریپت چندانتخابی شما
  max_categories: 3
  max_tags: 5
  combine_author_scripts: true  # «ریتا کنت (Rina Kent)» برای آثار ترجمه

  labels:
    iranian: "ایرانی"
    foreign: "خارجی"
    pdf: "پی دی اف"
    audio: "صوتی"

  summary:
    min_chars: 200
    max_chars: 1200
    max_sentences: 14

  numbers:
    min_agreement: 2            # چند منبع باید یک عدد بدهند تا مطمئن باشیم
    accept_single: true         # عدد تک‌منبعی نوشته شود ولی در گزارش علامت بخورد

  # گزینه‌های مجاز کرکره‌ها. راه اصلی، تبِ «لیست‌ها»ی خودِ شیت است؛ این‌جا فقط
  # پشتیبان است. ستون کرکره‌ای بدون فهرست، برچسب خام منابع را می‌گیرد.
  taxonomy: {}
  #   categories: ["رمان عاشقانه", "رمان اجتماعی"]
  #   category_synonyms:
  #     رمان عاشقانه: ["عاشقانه", "romance"]

image:
  enabled: true
  min_side: 400                 # کمتر از این پیکسل، کاور نیست
  square_tolerance: 0.04        # ۴٪ انحراف از مربع قابل قبول است
  max_downloads: 6              # حداکثر تصویری که هدرش گرفته می‌شود
  require_square: true
  allow_unknown_size: false     # تصویری که اندازه‌اش تأیید نشد نوشته نشود
  reject_url_patterns: []       # کلمه‌های اضافه (watermark، logo و ... پیش‌فرض‌اند)
  prefer_domains: []            # دامنه‌هایی که کاور تمیز دارند
  block_domains: []             # دامنه‌هایی که همیشه واترمارک می‌زنند

output:
  xlsx_path: "sheet_filler/data/filled-{stamp}.xlsx"
