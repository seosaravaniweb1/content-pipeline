# تنظیمات «تکمیل‌کننده‌ی گوگل‌شیت».
#     cp sheet_filler/config.example.yaml config.yaml
#
# **معمولاً به این فایل دست نمی‌زنید**: همه‌ی چیزهای روزمره از پنل تنظیم
# می‌شوند (آدرس شیت، سایت‌ها، حالت خودکار) و در دیتابیس ذخیره می‌مانند.
# این فایل برای دو چیز است: مسیر دیتابیس، و تنظیم‌های ریزی که به‌ندرت لازم
# می‌شوند.
#
# هیچ کلید API لازم نیست — هزینه‌ی این برنامه صفر است.

database:
  path: sheet_filler/data/filler.db

# سایت‌های منبع. از پنل هم می‌شود داد؛ اگر خالی بماند و نگاشت «عنوان → آدرس»
# ایمپورت کرده باشید، دامنه‌های همان لینک‌ها خودکار به‌عنوان منبع استفاده می‌شوند.
sites: []
#   - https://shop1.ir
#   - url: https://shop2.ir
#     search_url: "{base}/search?q={query}"   # سایت غیروردپرسی
#     include: ["/product/"]                  # فقط این آدرس‌ها صفحه‌ی محصول‌اند
#     site_name: "فروشگاه دو"                  # برای حذف نام سایت از <title>
#     js: true                                # با مرورگر گرفته شود

crawl:
  delay_seconds: 1.0            # حداکثر ۱ درخواست در ثانیه به هر دامنه
  timeout: 20
  user_agent: "SheetFillerBot/1.0 (+https://example.com/bot)"
  respect_robots: true
  playwright_fallback: true     # سایت‌های JS-heavy با مرورگر گرفته شوند

# ---------------------------------------------------------------------------
# از اینجا به بعد اختیاری است
# ---------------------------------------------------------------------------
# هر کلیدی که ننویسید، مقدار پیش‌فرضِ برنامه را می‌گیرد. فهرست کامل و مقدار
# پیش‌فرض هرکدام در core/filler.py کلاس FillOptions است.

